services:
  project-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comfyuiflow
      POSTGRES_USER: comfyuiflow
      POSTGRES_PASSWORD: comfyuiflow
    ports:
      - "127.0.0.1:5448:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comfyuiflow -d comfyuiflow"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - project-postgres-data:/var/lib/postgresql/data

volumes:
  project-postgres-data:
